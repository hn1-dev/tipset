name: Automatisk uppdatering

on:
  schedule:
    - cron: '0 8 * * 1'  # Kl 10:00 svensk sommartid (UTC+2)

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v5

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installera bibliotek
        run: |
          pip install -r requirements.txt

      - name: Kör skripten i ordning
        run: |
          python league_current_standings.py
          python app1.py

      - name: Spara och skicka ändringar
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add .
          git commit -m "Automatisk uppdatering" || exit 0
          git push
