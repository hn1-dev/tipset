name: Daily Update

on:
  schedule:
    - cron: '0 5 * * *' 
  workflow_dispatch:      

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v5 # Uppdaterad till v5

      - name: Installera Python
        uses: actions/setup-python@v6 # Uppdaterad till v6
        with:
          python-version: '3.11' # Passade på att uppgradera Python till en modernare version också

      - name: Installera bibliotek
        run: |
          pip install -r requirements.txt

      - name: Kör skriptet
        run: python app.py

      - name: Spara och skicka ändringar
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add .
          git commit -m "Automatisk uppdatering" || exit 0
          git push
